<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - StickNext Rail Saga</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body.admin-page { --primary-bg: #1a1a1a; --secondary-bg: #2d2d2d; --text-primary: #fff; --text-secondary: #ccc; }
        
        .admin-container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        
        /* Login Form */
        .login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: var(--secondary-bg); padding: 2rem; border-radius: 8px; width: 100%; max-width: 400px; border: 1px solid var(--border-color); }
        .login-box h2 { color: var(--text-primary); text-align: center; margin-bottom: 2rem; }
        .login-box input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--primary-bg); color: var(--text-primary); }
        .login-box button { width: 100%; padding: 0.75rem; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .login-box button:hover { background: #45a049; }
        .login-error { color: #f44336; text-align: center; margin-bottom: 1rem; }
        
        /* Admin Panel */
        .admin-panel { display: none; }
        .admin-panel.active { display: block; }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
        .admin-title { font-size: 1.8rem; color: var(--text-primary); margin: 0; }
        .admin-stats { display: flex; gap: 1rem; flex-wrap: wrap; }
        .stat-box { background: var(--secondary-bg); padding: 1rem; border-radius: 4px; border: 1px solid var(--border-color); }
        .stat-box .label { color: var(--text-secondary); font-size: 0.9rem; }
        .stat-box .value { font-size: 1.5rem; font-weight: bold; color: #4CAF50; }
        
        .admin-controls { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .admin-btn { padding: 0.75rem 1.5rem; background: var(--secondary-bg); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; transition: all 0.3s; }
        .admin-btn:hover { background: var(--text-primary); color: var(--primary-bg); }
        .admin-btn.danger { border-color: #f44336; color: #f44336; }
        .admin-btn.danger:hover { background: #f44336; color: white; }
        
        .search-box { width: 100%; max-width: 300px; padding: 0.75rem; background: var(--secondary-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary); }
        
        .search-box:focus {
            outline: none;
            border-color: #4CAF50;
            background: var(--secondary-bg);
        }
        
        .messages-list { display: flex; flex-direction: column; gap: 1rem; }
        .message-card { background: var(--secondary-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 1.5rem; cursor: pointer; transition: all 0.3s; }
        .message-card:hover { border-color: var(--text-primary); }
        .message-card.unread { border-left: 4px solid #4CAF50; }
        .message-card.read { opacity: 0.7; }
        
        .message-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
        .message-name { font-weight: bold; color: var(--text-primary); font-size: 1.1rem; }
        .message-time { color: var(--text-secondary); font-size: 0.9rem; }
        .message-badge { background: #4CAF50; color: white; padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.8rem; }
        .message-badge.read { background: var(--border-color); }
        
        .message-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .info-field { background: var(--primary-bg); padding: 0.75rem; border-radius: 4px; border: 1px solid var(--border-color); }
        .info-label { color: var(--text-secondary); font-size: 0.85rem; }
        .info-value { color: var(--text-primary); font-weight: 500; word-break: break-all; }
        
        .message-content { background: var(--primary-bg); padding: 1rem; border-radius: 4px; margin-bottom: 1rem; color: var(--text-secondary); max-height: 150px; overflow-y: auto; }
        
        .message-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .action-btn { padding: 0.5rem 1rem; font-size: 0.9rem; background: var(--text-primary); color: var(--primary-bg); border: none; border-radius: 4px; cursor: pointer; }
        .action-btn.secondary { background: var(--border-color); color: var(--text-primary); }
        .action-btn.danger { background: #f44336; }
        
        .empty-state { text-align: center; padding: 3rem; color: var(--text-secondary); }
        .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; }
        
        /* Modal untuk detail pesan */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--secondary-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 2rem; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .modal-header h3 { margin: 0; color: var(--text-primary); }
        .modal-close { background: none; border: none; color: var(--text-primary); font-size: 1.5rem; cursor: pointer; }
        .modal-field { margin-bottom: 1.5rem; }
        .modal-field label { display: block; color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.5rem; }
        .modal-field p { margin: 0; color: var(--text-primary); word-break: break-word; }
        
        @media (max-width: 768px) {
            .admin-header { flex-direction: column; align-items: flex-start; }
            .admin-controls { flex-direction: column; }
            .admin-controls > * { width: 100%; }
            .message-info { grid-template-columns: 1fr; }
        }

        @media (max-width: 480px) {
            .admin-container { padding: 1rem; }
            .admin-header { margin-bottom: 1rem; }
            .admin-title { font-size: 1.3rem; }
            .admin-stats { width: 100%; justify-content: space-between; }
            .stat-box { flex: 1; padding: 0.75rem; font-size: 0.85rem; }
            .stat-box .label { font-size: 0.75rem; }
            .stat-box .value { font-size: 1.3rem; }
            .search-box { font-size: 16px; } /* Prevents zoom on iOS */
            .message-card { padding: 1rem; }
            .message-name { font-size: 0.95rem; }
            .message-header { flex-direction: column; gap: 0.75rem; }
            .message-actions { flex-direction: column; }
            .action-btn { width: 100%; font-size: 0.85rem; padding: 0.5rem 0.75rem; }
            .modal-content { max-width: 90vw; padding: 1.5rem; width: 100%; }
            .modal-field label { font-size: 0.8rem; }
            .modal-field p { font-size: 0.9rem; }
        }

        @media (max-width: 360px) {
            .admin-container { padding: 0.75rem; }
            .admin-title { font-size: 1.1rem; }
            .message-card { padding: 0.75rem; }
            .stat-box { padding: 0.5rem; }
            .stat-box .value { font-size: 1.1rem; }
        }
    </style>
</head>
<body class="admin-page">
    <!-- Login Modal -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>🔐 Admin Panel</h2>
            <div class="login-error" id="loginError" style="display: none;"></div>
            <input type="password" id="passwordInput" placeholder="Masukkan password" autofocus>
            <button onclick="handleLogin()">Masuk</button>
            <p style="text-align: center; color: var(--text-secondary); margin-top: 1rem; font-size: 0.9rem;">
                Password default: <code style="background: var(--primary-bg); padding: 0.25rem 0.5rem; border-radius: 2px;">sticknext2026</code>
            </p>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
        <header class="header">
            <div class="header-content">
                <h1 class="header-title">Admin Panel</h1>
                <p class="header-subtitle">Manajemen pesan & pesanan</p>
            </div>
        </header>

        <main class="main-content">
            <div class="admin-container">
                <!-- Admin Header -->
                <div class="admin-header">
                    <h2 class="admin-title">📬 Pesan Masuk</h2>
                    <div class="admin-stats">
                        <div class="stat-box">
                            <div class="label">Total Pesan</div>
                            <div class="value" id="totalMessages">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="label">Belum Dibaca</div>
                            <div class="value" id="unreadMessages">0</div>
                        </div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="admin-controls">
                    <input type="text" class="search-box" id="searchInput" placeholder="Cari nama, email, telpon...">
                    <button class="admin-btn" onclick="handleExport()">📥 Export JSON</button>
                    <button class="admin-btn" onclick="handleChangeServiceCode()">🔑 Ubah Service Code</button>
                    <button class="admin-btn" onclick="handleChangePassword()">🔐 Ubah Password</button>
                    <button class="admin-btn danger" onclick="handleLogout()">🚪 Keluar</button>
                </div>

                <!-- Messages List -->
                <div id="messagesList" class="messages-list"></div>
                
                <!-- Empty State -->
                <div class="empty-state" id="emptyState" style="display: none;">
                    <div class="empty-state-icon">📭</div>
                    <p>Belum ada pesan masuk</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Message Detail Modal -->
    <div class="modal" id="messageModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Detail Pesan</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="admin.js"></script>
    <script src="settings.js"></script>
    <script src="smart-protection.js"></script>
    <script>
        // ===== SECURITY CHECK =====
        // Redirect to unlock jika session tidak valid
        const adminStorage = new AdminStorage();
        
        if (!adminStorage.isSessionUnlocked()) {
            console.log('❌ Session invalid! Redirecting to unlock.html');
            window.location.href = 'unlock.html';
        }
        
        console.log('✅ Session valid. Admin panel loaded');

        let currentPage = 'login';
        let searchQuery = '';

        // Handle Login
        function handleLogin() {
            const password = document.getElementById('passwordInput').value;
            if (!password) {
                showLoginError('Silakan masukkan password');
                return;
            }

            if (adminStorage.verifyPassword(password)) {
                currentPage = 'panel';
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminPanel').classList.add('active');
                loadMessages();
                setupSearch();
            } else {
                showLoginError('❌ Password tidak sesuai');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        // Show Login Error
        function showLoginError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }

        // Load Messages
        function loadMessages() {
            const messages = searchQuery ? adminStorage.searchMessages(searchQuery) : adminStorage.getAllMessages();
            const messagesList = document.getElementById('messagesList');
            const emptyState = document.getElementById('emptyState');
            
            // Update stats
            document.getElementById('totalMessages').textContent = adminStorage.getAllMessages().length;
            document.getElementById('unreadMessages').textContent = adminStorage.getUnreadCount();

            if (messages.length === 0) {
                messagesList.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            messagesList.innerHTML = messages.reverse().map(msg => `
                <div class="message-card ${msg.read ? 'read' : 'unread'}" onclick="openMessageDetail(${msg.id})">
                    <div class="message-header">
                        <div>
                            <div class="message-name">${escapeHtml(msg.name)}</div>
                            <div class="message-time">${adminStorage.formatDate(msg.createdAt)}</div>
                        </div>
                        <span class="message-badge ${msg.read ? 'read' : ''}">${msg.read ? 'Dibaca' : 'Baru'}</span>
                    </div>
                    <div class="message-info">
                        <div class="info-field">
                            <div class="info-label">📧 Email</div>
                            <div class="info-value">${escapeHtml(msg.email)}</div>
                        </div>
                        <div class="info-field">
                            <div class="info-label">📱 Telepon</div>
                            <div class="info-value">${escapeHtml(msg.phone)}</div>
                        </div>
                        <div class="info-field">
                            <div class="info-label">📝 Subjek</div>
                            <div class="info-value">${escapeHtml(msg.subject)}</div>
                        </div>
                    </div>
                    <div class="message-content">${escapeHtml(msg.message)}</div>
                    <div class="message-actions">
                        <button class="action-btn" onclick="event.stopPropagation(); handleMarkAsRead(${msg.id})">
                            ${msg.read ? '🔄 Tandai Belum Dibaca' : '✓ Tandai Dibaca'}
                        </button>
                        <button class="action-btn secondary" onclick="event.stopPropagation(); handleCopyEmail('${msg.email}')">
                            📋 Salin Email
                        </button>
                        <button class="action-btn secondary" onclick="event.stopPropagation(); handleCopyPhone('${msg.phone}')">
                            📋 Salin Telepon
                        </button>
                        <button class="action-btn danger" onclick="event.stopPropagation(); handleDeleteMessage(${msg.id})">
                            🗑️ Hapus
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Open Message Detail
        function openMessageDetail(id) {
            const msg = adminStorage.getMessageById(id);
            if (!msg) return;

            adminStorage.markAsRead(id);

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="modal-field">
                    <label>Nama</label>
                    <p>${escapeHtml(msg.name)}</p>
                </div>
                <div class="modal-field">
                    <label>Email</label>
                    <p>${escapeHtml(msg.email)}</p>
                </div>
                <div class="modal-field">
                    <label>Telepon</label>
                    <p>${escapeHtml(msg.phone)}</p>
                </div>
                <div class="modal-field">
                    <label>Subjek</label>
                    <p>${escapeHtml(msg.subject)}</p>
                </div>
                <div class="modal-field">
                    <label>Pesan</label>
                    <p>${escapeHtml(msg.message).replace(/\n/g, '<br>')}</p>
                </div>
                <div class="modal-field">
                    <label>Tanggal</label>
                    <p>${adminStorage.formatDate(msg.createdAt)}</p>
                </div>
            `;

            document.getElementById('messageModal').classList.add('active');
            loadMessages();
        }

        // Close Modal
        function closeModal() {
            document.getElementById('messageModal').classList.remove('active');
        }

        // Mark as Read
        function handleMarkAsRead(id) {
            const msg = adminStorage.getMessageById(id);
            adminStorage.markAsRead(id);
            msg.read = !msg.read;
            loadMessages();
        }

        // Delete Message
        function handleDeleteMessage(id) {
            if (confirm('Hapus pesan ini?')) {
                adminStorage.deleteMessage(id);
                loadMessages();
            }
        }

        // Copy to Clipboard
        function handleCopyEmail(email) {
            navigator.clipboard.writeText(email).then(() => {
                alert('Email disalin: ' + email);
            });
        }

        function handleCopyPhone(phone) {
            navigator.clipboard.writeText(phone).then(() => {
                alert('Telepon disalin: ' + phone);
            });
        }

        // Export Messages
        function handleExport() {
            adminStorage.exportMessages();
            alert('Pesan berhasil di-export');
        }

        // Change Password
        function handleChangePassword() {
            const oldPass = prompt('Masukkan password lama:');
            if (!oldPass) return;
            
            const newPass = prompt('Masukkan password baru (minimal 6 karakter):');
            if (!newPass) return;
            
            const result = adminStorage.changePassword(oldPass, newPass);
            alert(result.message);
        }

        // Change Service Code
        function handleChangeServiceCode() {
            const newCode = prompt('Masukkan service code baru (minimal 3 karakter):');
            if (!newCode) return;
            
            const result = adminStorage.changeServiceCode(newCode);
            alert(result.message);
        }

        // Logout
        function handleLogout() {
            if (confirm('Keluar dari portal rahasia?')) {
                // Clear session properly
                adminStorage.clearSessionUnlock();
                sessionStorage.clear();
                localStorage.removeItem('sticknext_admin_unlocked');
                console.log('✓ Logout: Session cleared completely');
                
                // Redirect to hidden portal (user bisa pilih halaman lain)
                window.location.href = 'hidden-portal.html';
            }
        }

        // Setup Search
        function setupSearch() {
            document.getElementById('searchInput').addEventListener('input', function(e) {
                searchQuery = e.target.value;
                loadMessages();
            });
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow Enter key to login
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('passwordInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    handleLogin();
                }
            });

            // Close modal when clicking outside
            document.getElementById('messageModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Prevent back button bypass
        window.addEventListener('beforeunload', function(e) {
            // Clear session when leaving admin panel
            adminStorage.clearSessionUnlock();
        });

        // Prevent direct access if session lost (double check)
        setInterval(function() {
            if (!adminStorage.isSessionUnlocked()) {
                console.log('⚠️ Session expired! Redirecting...');
                window.location.href = 'unlock.html';
            }
        }, 5000); // Check every 5 seconds
    </script>
</body>
</html>
